# Copy this file into your repo as .github/workflows/pr-label.yml
# It labels every new PR with UNREVIEWED and removes the label again when the
# PR is approved (also after merge). Reminders stop once the label is gone.
# A review without approval: remove the label manually.
name: PR label
on:
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]
permissions:
  pull-requests: write
  issues: write
jobs:
  label:
    uses: dreipol/github-actions/.github/workflows/reusable-pr-label.yml@master
